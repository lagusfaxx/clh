# =============================================================================
# docker-compose.yml - Desarrollo local
# Levanta Postgres+PostGIS y Redis. La app Next.js se corre con `pnpm dev`
# en el host. Para producción usar docker-compose.coolify.yml.
# =============================================================================

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chilehistorico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-chilehistorico}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER:-chilehistorico}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ch_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
